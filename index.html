<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description"
        content="Escalas semanais de limpeza e da máquina de lavar da República Tabajara, com destaque automático do dia atual.">
    <title>Escalas Tabajara — Limpeza & Lavanderia</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧹</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
</head>

<body>
    <a href="#main-content" class="sr-only skip-to-content">Ir para o conteúdo</a>

    <header class="page-header">
        <h1>
            <span class="material-symbols-rounded" aria-hidden="true">mop</span>
            Escalas Tabajara
        </h1>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar para modo escuro"
            aria-pressed="false">
            <span class="material-symbols-rounded theme-icon" id="themeIcon" aria-hidden="true">light_mode</span>
        </button>
    </header>

    <main id="main-content">
        <section class="cleaning-schedule-section" aria-labelledby="cleaning-title">
            <h2 id="cleaning-title" class="sr-only">Escala de limpeza</h2>
            <div class="schedule-container" id="cleaningSchedule"></div>
        </section>

        <section class="washing-schedule" aria-labelledby="washing-title">
            <h2 id="washing-title">
                <span class="material-symbols-rounded" aria-hidden="true">local_laundry_service</span>
                Máquina de Lavar
            </h2>
            <div class="table-container">
                <table>
                    <caption>Escala de uso da máquina por dia da semana</caption>
                    <thead>
                        <tr>
                            <th scope="col">Dia</th>
                            <th scope="col">Quem usa?</th>
                        </tr>
                    </thead>
                    <tbody id="washingTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <p>&copy; <span id="currentYear"></span> · Desenvolvido por Espalha Lixo</p>
    </footer>

    <script src="src/js/app.js" type="module"></script>
</body>

</html>
